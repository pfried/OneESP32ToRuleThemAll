#########################################
#                                       #
#   THZ IBC topline – diagnostics       #
#                                       #
#########################################
# Optional companion to thz_ibc_topline.yaml. Exposes values that show up on
# the bus but are not identified yet as raw diagnostic sensors, so they can be
# compared with the display (Info menu) over time and then given real names.
# Purely passive: nothing is requested or written.
#
# Name pattern: DIAG_<sender>_<index>. The scale is a guess (x0.1 where the raw
# value looks like a temperature/percentage). 0x8000 ("not available") is
# published as unknown. The comment behind each entry is the range observed so far.

sensor:
